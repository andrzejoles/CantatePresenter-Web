<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie — CantatePresenter Web</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
        }
        .auth-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-wrap img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
        .app-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #38bdf8;
        }
        .app-desc {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin: 0 0 24px 0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .alert {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #6ee7b7;
        }
        .emergency-toggle {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
            cursor: pointer;
            text-decoration: underline;
        }
        .emergency-box {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #334155;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="logo-wrap">
        <img src="/data/logos/equipes_notre_dame_official_logo.png" alt="Equipes Notre-Dame Logo" onerror="this.src='/data/logos/logoEND.png'">
    </div>
    <h1 class="app-title">CantatePresenter</h1>
    <p class="app-desc">Wymagane uwierzytelnienie administratora</p>

    <div id="alertBox" class="alert alert-error"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Nazwa użytkownika</label>
            <input type="text" id="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
            <label for="password">Hasło</label>
            <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Zaloguj się</button>
    </form>

    <!-- Emergency Reset Accordion -->
    <div class="emergency-toggle" id="toggleEmergency">⚠️ Reset awaryjny (wymaga Master Setup Key)</div>

    <div class="emergency-box" id="emergencyBox">
        <p style="font-size: 11px; color: #f59e0b; margin: 0 0 10px 0;">
            Wprowadź Klucz Konfiguracji Początkowej (znajdziesz go w konsoli serwera lub pliku <code>data/.bootstrap_key</code>), aby wyczyścić konto i ponownie uruchomić kreator konfiguracji.
        </p>
        <div class="form-group">
            <label for="masterResetKey">Master Setup Key</label>
            <input type="password" id="masterResetKey" placeholder="Poufny klucz serwera">
        </div>
        <button type="button" class="btn-submit" id="resetBtn" style="background: #dc2626;">Wykonaj reset awaryjny</button>
    </div>
</div>

<script>
    const alertBox = document.getElementById('alertBox');

    function showAlert(msg, isError = true) {
        alertBox.textContent = msg;
        alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
        alertBox.style.display = 'block';
    }

    // Check if configuration is needed
    fetch('/api/auth/status')
        .then(res => res.json())
        .then(data => {
            if (!data.isConfigured) {
                window.location.href = '/setup.html';
            } else if (data.isAuthenticated) {
                window.location.href = '/';
            }
        })
        .catch(() => {});

    // Login Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');

        btn.disabled = true;
        btn.textContent = 'Logowanie...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Cantate-Request': '1'
                },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                showAlert('Zalogowano pomyślnie. Przekierowanie...', false);
                setTimeout(() => window.location.href = '/', 500);
            } else {
                showAlert(data.error || 'Błąd logowania');
                btn.disabled = false;
                btn.textContent = 'Zaloguj się';
            }
        } catch (err) {
            showAlert('Błąd połączenia z serwerem.');
            btn.disabled = false;
            btn.textContent = 'Zaloguj się';
        }
    });

    // Toggle Emergency Reset
    const toggleBtn = document.getElementById('toggleEmergency');
    const emergencyBox = document.getElementById('emergencyBox');
    toggleBtn.addEventListener('click', () => {
        emergencyBox.style.display = emergencyBox.style.display === 'block' ? 'none' : 'block';
    });

    // Emergency Reset Handler
    document.getElementById('resetBtn').addEventListener('click', async () => {
        const masterKey = document.getElementById('masterResetKey').value.trim();
        if (!masterKey) {
            showAlert('Podaj Master Setup Key.');
            return;
        }

        if (!confirm('Czy na pewno chcesz zresetować konto administratora i przejść do ponownej konfiguracji?')) {
            return;
        }

        try {
            const res = await fetch('/api/auth/emergency-reset', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Cantate-Request': '1'
                },
                body: JSON.stringify({ masterKey })
            });
            const data = await res.json();

            if (data.success) {
                alert('Reset wykonany pomyślnie! Przekierowanie do kreatora konfiguracji...');
                window.location.href = '/setup.html';
            } else {
                showAlert(data.error || 'Nieprawidłowy klucz.');
            }
        } catch (err) {
            showAlert('Błąd połączenia z serwerem.');
        }
    });
</script>

</body>
</html>
