<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CantatePresenter — Ekran Rzutnika</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            cursor: none; /* Hide cursor on projector */
        }
        body.show-cursor {
            cursor: default;
        }
        .container {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: 7vh 7vw;
            align-items: center;
            justify-content: center;
        }
        .slide-text {
            font-size: 5.5vw;
            font-weight: 700;
            line-height: 1.15;
            text-align: center;
            width: 100%;
            white-space: pre-line;
            word-wrap: break-word;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.85);
            transition: opacity 0.15s ease-in-out;
        }
        .slide-badge {
            position: absolute;
            bottom: 20px;
            right: 28px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 12px;
            border-radius: 4px;
        }
        /* Standby Screen */
        .standby-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .standby-logo {
            width: 160px;
            height: 160px;
            margin-bottom: 24px;
        }
        .standby-logo svg {
            width: 100%;
            height: 100%;
        }
        .standby-title {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
        }
        .standby-version {
            color: #94a3b8;
            font-size: 18px;
            margin-top: 10px;
        }
        /* Fullscreen hint overlay */
        .fs-hint {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #38bdf8;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        body:hover .fs-hint {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="fs-hint" id="fsHint" style="cursor: pointer; pointer-events: auto;">Podwójny klik lub F11 dla pełnego ekranu • ESC, aby wyjść</div>

<div class="container" id="contentContainer">
    <!-- Standby or Live Slide is rendered here -->
</div>

<div class="slide-badge" id="slideBadge" style="display: none;"></div>

<script type="module" src="/js/projector.js"></script>
</body>
</html>
