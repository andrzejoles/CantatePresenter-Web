<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfiguracja Początkowa — CantatePresenter Web</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
        }
        .setup-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 36px 32px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
            margin: 0 0 8px 0;
        }
        .header p {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
            line-height: 1.4;
        }
        .info-callout {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid #2563eb;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #bfdbfe;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .alert {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
    </style>
</head>
<body>

<div class="setup-card">
    <div class="header">
        <h1>⚙️ Konfiguracja Początkowa</h1>
        <p>Witaj w CantatePresenter Web! Aby zabezpieczyć serwis, zdefiniuj konto administratora.</p>
    </div>

    <div class="info-callout">
        <strong>Poufny Master Setup Key:</strong> Znajdziesz go w logach/konsoli serwera przy pierwszym uruchomieniu lub w pliku <code>data/.bootstrap_key</code> na Twoim VPS.
    </div>

    <div id="alertBox" class="alert alert-error"></div>

    <form id="setupForm">
        <div class="form-group">
            <label for="masterKey">Master Setup Key (Poufny klucz instalacyjny)</label>
            <input type="password" id="masterKey" required placeholder="Wklej klucz z konsoli serwera" autofocus>
        </div>

        <div class="form-group">
            <label for="username">Nowa nazwa administratora</label>
            <input type="text" id="username" required minlength="3" placeholder="np. andrzej lub admin">
        </div>

        <div class="form-group">
            <label for="password">Hasło administratora (min. 8 znaków)</label>
            <input type="password" id="password" required minlength="8" placeholder="Bezpieczne hasło">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Powtórz hasło</label>
            <input type="password" id="confirmPassword" required minlength="8" placeholder="Powtórz hasło">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Zatwierdź i Utwórz Konto</button>
    </form>
</div>

<script>
    const alertBox = document.getElementById('alertBox');
    function showError(msg) {
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
    }

    // Check if already configured
    fetch('/api/auth/status')
        .then(res => res.json())
        .then(data => {
            if (data.isConfigured) {
                window.location.href = '/login.html';
            }
        })
        .catch(() => {});

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const masterKey = document.getElementById('masterKey').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            showError('Hasła nie są identyczne.');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Zapisywanie...';

        try {
            const res = await fetch('/api/auth/setup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Cantate-Request': '1'
                },
                body: JSON.stringify({ masterKey, username, password })
            });
            const data = await res.json();

            if (data.success) {
                alert('Konfiguracja zakończona sukcesem! Przekierowanie do pulpitu...');
                window.location.href = '/';
            } else {
                showError(data.error || 'Błąd konfiguracji.');
                btn.disabled = false;
                btn.textContent = 'Zatwierdź i Utwórz Konto';
            }
        } catch (err) {
            showError('Błąd połączenia z serwerem.');
            btn.disabled = false;
            btn.textContent = 'Zatwierdź i Utwórz Konto';
        }
    });
</script>

</body>
</html>
