<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CantatePresenter — Ekran Czuwania</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #1e2640 0%, #0d111d 70%, #07090e 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle ambient glow behind logo */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.22) 0%, rgba(6, 182, 212, 0.12) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 1;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .container {
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px;
        }

        /* Custom Vector Logo */
        .logo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 12px 30px rgba(79, 70, 229, 0.4));
        }

        .logo-svg {
            width: 100%;
            height: 100%;
        }

        /* Typography */
        h1.app-title {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 60%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.1;
        }

        .app-subtitle {
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #38bdf8;
            margin-top: -6px;
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 0.88rem;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.02em;
            backdrop-filter: blur(10px);
            margin-top: 6px;
        }

        .version-badge .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Bottom status & clock */
        .footer-status {
            position: absolute;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .live-clock {
            font-size: 1.25rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.06em;
        }
    </style>
</head>

        function updateClock() {
            const now = new Date();

            const minutes = String(now.getMinutes()).padStart(2, '0');
